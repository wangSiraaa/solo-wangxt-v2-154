services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jiaokan
      POSTGRES_PASSWORD: jiaokan
      POSTGRES_DB: jiaokan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jiaokan"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 可选：真正的 CollateX REST 服务（需能拉取镜像/构建）。
  # 不部署也不影响系统运行——后端会退回内置渐进比对，并在 run.engine 中标注。
  collatex:
    image: mpilhlt/collatex:latest
    profiles: ["collatex"]
    ports:
      - "7369:7369"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://jiaokan:jiaokan@db:5432/jiaokan
      COLLATEX_MODE: auto
      COLLATEX_URL: http://collatex:7369/collate
      SEED_ON_STARTUP: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "yarn install && yarn dev --host 0.0.0.0"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
